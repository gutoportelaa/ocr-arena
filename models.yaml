external_engines:
  tesseract:
    enabled: true
    path: "${TESSERACT_PATH}"
    language: "por+eng"
  docling:
    enabled: false # Requires API key and endpoint configuration
    api_key: "${DOCLING_API_KEY}"
    endpoint: "${DOCLING_ENDPOINT}"
  marker:
    enabled: false # Requires local installation and model path
    model_path: "${MARKER_MODEL_PATH}"
  markitdown:
    enabled: false # Requires specific OCR plugin/setup
    # Configuration for MarkItDown OCR plugin if available
