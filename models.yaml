          "rotation_guess": {"type": "integer"},
          "has_tables": {"type": "boolean"},
          "has_images": {"type": "boolean"},
          "text_markdown": {"type": "string"},
          "text_plain": {"type": "string"}
        },
        "required": ["page_number", "text_markdown", "text_plain"]
      }
