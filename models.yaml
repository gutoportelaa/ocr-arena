ollama_models:
  olmocr2:
    name: "richardyoung/olmocr2"
    prompt_template: "Extract all visible text from this image, preserving natural reading order. Do not summarize, interpret, or freely correct. Preserve titles, lists, simple tables, and blocks. Indicate uncertainty for illegible sections. Do not invent content."
    json_schema: |
      {
        "type": "object",
        "properties": {
          "page_number": {"type": "integer"},
          "language_guess": {"type": "string"},
          "rotation_guess": {"type": "integer"},
          "has_tables": {"type": "boolean"},
          "has_images": {"type": "boolean"},
          "text_markdown": {"type": "string"},
          "text_plain": {"type": "string"}
        },
        "required": ["page_number", "text_markdown", "text_plain"]
      }
