    name: "glm-ocr"
    prompt_template: "Extract all visible text from this image, preserving natural reading order. Do not summarize, interpret, or freely correct. Preserve titles, lists, simple tables, and blocks. Indicate uncertainty for illegible sections. Do not invent content."
