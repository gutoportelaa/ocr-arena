[project]
name = "ocr_benchmark"
version = "0.1.0"
description = "Benchmark profissional para OCR e extração documental em PDFs."
authors = [
    { name = "Manus AI", email = "ai@manus.im" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "ollama>=0.1.0",
    "pillow>=10.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "pandas>=2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "torch>=2.0",
    "torchvision>=0.17.0",
    "transformers==4.57.1",
    "sentence-transformers>=2.2.2",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "rich>=15.0.0",
    "tabulate>=0.10.0",
    "docling>=2.0",
    "einops>=0.8.0",
    "addict>=2.4.0",
    "easydict>=1.13",
    "matplotlib>=3.10.0",
    "psutil>=7.0.0",
]

[project.scripts]
ocr_benchmark = "src.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
