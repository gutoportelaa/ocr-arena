ollama_prompts:
  ocr_base_prompt: |
    Extract all visible text from this image, preserving natural reading order. Do not summarize, interpret, or freely correct. Preserve titles, lists, simple tables, and blocks. Indicate uncertainty for illegible sections. Do not invent content.

  structured_output_schema: |
    {
      "type": "object",
      "properties": {
        "page_number": {"type": "integer"},
        "language_guess": {"type": "string"},
        "rotation_guess": {"type": "integer"},
        "has_tables": {"type": "boolean"},
        "has_images": {"type": "boolean"},
        "text_markdown": {"type": "string"},
        "text_plain": {"type": "string"}
      },
      "required": ["page_number", "text_markdown", "text_plain"]
    }

semantic_analysis_prompts:
  comparison_prompt: |
    Compare two text outputs from OCR engines. Identify which one is more complete, point out losses, noise, and structural errors. Return only a valid JSON following this schema:
    {
      "type": "object",
      "properties": {
        "completeness_comparison": {"type": "string", "description": "Which output is more complete, or if they are similar"},
        "losses_identified": {"type": "array", "items": {"type": "string"}, "description": "List of text sections missing in one output compared to the other"},
        "noise_identified": {"type": "array", "items": {"type": "string"}, "description": "List of irrelevant or incorrect text sections present in an output"},
        "structural_errors": {"type": "array", "items": {"type": "string"}, "description": "List of structural discrepancies like incorrect table parsing or list formatting"}
      },
      "required": ["completeness_comparison"]
    }
